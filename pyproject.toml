[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "control-stock"
version = "0.1.0"
description = "Inventory Management System for Apparel E-commerce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "sqlalchemy>=2.0.35,<2.2",
    "alembic>=1.16.0,<2.0",
    "psycopg[binary]>=3.2.3,<4.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations embed long SQL expressions (e.g. CHECK constraints).
"migrations/versions/*" = ["E501"]
