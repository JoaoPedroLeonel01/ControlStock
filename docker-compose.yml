services:
  postgres:
    image: postgres:16-alpine
    container_name: control_stock_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-control_stock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-control_stock_pass}
      POSTGRES_DB: ${POSTGRES_DB:-control_stock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
